name: Scala CI

on:
  push:
    branches-ignore:
      - "update/**"
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Scala 2.12 builds the sbt 1.x plugin, Scala 3 builds the sbt 2.x
        # plugin. Keep these lanes aligned with the explicit build settings.
        scala:
          - "2.12.x"
          - "3.x"
        distribution:
          - temurin
        java:
          - 8
          - 11
          - 17
          - 21
          - 25
        exclude:
          # sbt 2.x requires JDK 17 or later.
          - scala: "3.x"
            java: 8
          - scala: "3.x"
            java: 11

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Need the git history for sbt-dynver to determine the version
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
      - uses: sbt/setup-sbt@v1
      - name: Cache SBT
        uses: actions/cache@v3
        with:
          path: |
            ~/.ivy2/local/
            ~/.ivy2/cache/
            ~/.sbt/
            ~/.coursier/
          key: |
            ${{runner.os}}-${{matrix.scala}}-${{hashFiles('**/*.sbt')}}-${{matrix.sbt-args}}
            ${{runner.os}}-${{matrix.scala}}-${{hashFiles('**/*.sbt')}}-
            ${{runner.os}}-${{matrix.scala}}-
      - name: Run tests
        run: sbt ${{matrix.sbt-args}} ++${{ matrix.scala }} test
      # Publish both plugin lanes on JDK 17, retaining the sbt 1 bytecode target.
      - name: Publish to Maven Central Repository
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{secrets.PERSONAL_ACCESS_TOKEN}}
        if: ${{ env.GITHUB_PERSONAL_ACCESS_TOKEN != '' && github.repository == 'ThoughtWorksInc/sbt-api-mappings' && github.event_name != 'pull_request' && matrix.java == 17 && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: sbt ${{matrix.sbt-args}} ++${{ matrix.scala }} publishSigned sonaRelease
